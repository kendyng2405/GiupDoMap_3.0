<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23CC0000'/><path d='M50 75 L22 48 C16 42 16 32 22 26 C28 20 38 20 44 26 L50 32 L56 26 C62 20 72 20 78 26 C84 32 84 42 78 48 Z' fill='%23FFD700'/></svg>">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trái Tim Việt — Bản đồ từ thiện</title>
  <meta name="description" content="Kết nối người muốn từ thiện đến những nơi cần hỗ trợ">
  <script>
    (function(){
      const t = localStorage.getItem('ttv_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/public/css/main.css">
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="navbar-inner">
    <a href="/home" class="nav-brand">
      <div class="brand-logo"></div>
      <span class="brand-name">Trái Tim Việt</span>
    </a>

    <div class="nav-links" id="main-nav">
      <a href="/home" class="nav-link" data-nav="/home">Bản đồ</a>
      <span id="nav-admin" style="display:none;">
        <a href="/admin/dashboard" class="nav-link" data-nav="/admin/dashboard">Quản Trị</a>
      </span>
      <!-- Chỉ hiển thị cho member (không phải admin/founder) -->
      <span id="nav-user-link" style="display:none;">
        <a href="/profile" class="nav-link" data-nav="/profile">Hồ sơ</a>
        <a href="/suggest" class="nav-link" data-nav="/suggest">Đề xuất địa điểm</a>
      </span>
      <!-- Hồ sơ cho admin/founder (không có đề xuất địa điểm) -->
      <span id="nav-admin-profile" style="display:none;">
        <a href="/profile" class="nav-link" data-nav="/profile">Hồ sơ</a>
      </span>

      <!-- Mobile-only: user/guest actions inside burger menu -->
      <div class="mobile-nav-actions">
        <div id="mob-nav-guest" style="display:none;">
          <a href="/login" class="nav-link">Đăng nhập</a>
          <a href="/register" class="nav-link nav-link--accent">Đăng ký</a>
        </div>
        <div id="mob-nav-user" style="display:none;">
          <a href="/profile" class="nav-link mob-user-pill" id="mob-nav-user-pill">
            <div class="nav-avatar" id="mob-nav-avatar">U</div>
            <div>
              <div class="nav-user-name" id="mob-nav-username">...</div>
              <div class="nav-user-rank" id="mob-nav-rank">...</div>
            </div>
          </a>
          <button id="mob-logout-btn" class="nav-link nav-link--danger">Đăng xuất</button>
        </div>
      </div>
    </div>

    <div class="nav-actions">
      <button class="theme-toggle" id="theme-btn" aria-label="Chuyen che do sang/toi" style="margin-left:auto">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <div id="nav-guest" style="display:flex;align-items:center;gap:8px;">
        <a href="/login" class="btn btn--ghost btn--sm">Đăng nhập</a>
        <a href="/register" class="btn btn--primary btn--sm">Đăng ký</a>
      </div>

      <div id="nav-user" style="display:none;align-items:center;gap:8px;">
        <!-- Chuông thông báo -->
        <button id="notif-bell" class="theme-toggle" aria-label="Thông báo" title="Thông báo" style="position:relative;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="notif-badge" style="display:none;position:absolute;top:-4px;right:-4px;
            background:var(--accent);color:white;font-size:.58rem;font-weight:700;
            min-width:16px;height:16px;border-radius:999px;
            align-items:center;justify-content:center;padding:0 3px;
            border:2px solid var(--card);">0</span>
        </button>

        <a href="/profile" class="nav-user-pill">
          <div class="nav-avatar" id="nav-avatar">U</div>
          <div>
            <div class="nav-user-name" id="nav-username">...</div>
            <div class="nav-user-rank" id="nav-rank">...</div>
          </div>
        </a>
        <button id="logout-btn" class="btn btn--ghost btn--sm">Đăng xuất</button>
      </div>

      <button class="navbar-burger" id="burger-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div id="app" role="main"></div>
<div id="toast-container" class="toast-container"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>
  document.getElementById('theme-btn').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('ttv_theme', next);
  });

  document.getElementById('burger-btn').addEventListener('click', () => {
    document.getElementById('main-nav').classList.toggle('open');
  });

  // Close mobile menu when any nav link is clicked
  document.getElementById('main-nav').addEventListener('click', (e) => {
    if (e.target.closest('.nav-link') || e.target.closest('#mob-logout-btn')) {
      document.getElementById('main-nav').classList.remove('open');
    }
  });

  document.addEventListener('click', (e) => {
    if (e.target.closest('#logout-btn') || e.target.closest('#mob-logout-btn')) {
      e.preventDefault();
      import('./controllers/AuthController.js').then(m => m.AuthController.logout());
    }
    // Close menu on outside click
    if (!e.target.closest('#main-nav') && !e.target.closest('#burger-btn')) {
      document.getElementById('main-nav').classList.remove('open');
    }
  });

  window._updateNavbarUser = function(userData) {
    const isLoggedIn = !!userData;
    const isAdmin    = userData?.role === 'admin';
    const isFounder  = userData?.role === 'founder';
    const isPriv     = isAdmin || isFounder;

    const guestEl        = document.getElementById('nav-guest');
    const userEl         = document.getElementById('nav-user');
    const adminEl        = document.getElementById('nav-admin');
    const userLinkEl     = document.getElementById('nav-user-link');
    const adminProfileEl = document.getElementById('nav-admin-profile');

    if (guestEl)        guestEl.style.display        = isLoggedIn ? 'none'   : 'flex';
    if (userEl)         userEl.style.display         = isLoggedIn ? 'flex'   : 'none';
    if (adminEl)        adminEl.style.display        = isPriv     ? 'inline' : 'none';
    // "Đề xuất địa điểm" chỉ hiện cho member thường (không phải admin/founder)
    if (userLinkEl)     userLinkEl.style.display     = (isLoggedIn && !isPriv) ? 'inline' : 'none';
    // Hồ sơ cho admin/founder
    if (adminProfileEl) adminProfileEl.style.display = isPriv     ? 'inline' : 'none';

    // Sync mobile menu
    const mobGuest = document.getElementById('mob-nav-guest');
    const mobUser  = document.getElementById('mob-nav-user');
    if (mobGuest) mobGuest.style.display = isLoggedIn ? 'none'  : 'block';
    if (mobUser)  mobUser.style.display  = isLoggedIn ? 'block' : 'none';

    if (userData) {
      const avatarEl    = document.getElementById('nav-avatar');
      const mobAvatarEl = document.getElementById('mob-nav-avatar');
      const nameEl      = document.getElementById('nav-username');
      const mobNameEl   = document.getElementById('mob-nav-username');
      const rankEl      = document.getElementById('nav-rank');
      const mobRankEl   = document.getElementById('mob-nav-rank');

      if (avatarEl) {
        if (userData.photoURL) {
          avatarEl.innerHTML = '<img src="' + userData.photoURL + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
          if (mobAvatarEl) mobAvatarEl.innerHTML = avatarEl.innerHTML;
        } else {
          const initial = (userData.fullName || 'U').charAt(0).toUpperCase();
          avatarEl.textContent = initial;
          if (mobAvatarEl) mobAvatarEl.textContent = initial;
        }
      }
      if (nameEl) nameEl.textContent = userData.fullName || '';
      if (mobNameEl) mobNameEl.textContent = userData.fullName || '';

      const roleLabel = isFounder ? 'Người sáng lập' : isAdmin ? 'Người dẫn lửa' : (userData.rank?.name || 'Đồng Lòng');
      if (rankEl) rankEl.textContent = roleLabel;
      if (mobRankEl) mobRankEl.textContent = roleLabel;

      // Founder: inject users nav link once
      if (isFounder && !document.getElementById('nav-founder-users')) {
        const span = document.createElement('span');
        span.id = 'nav-founder-users';
        span.innerHTML = '<a href="/admin/users" class="nav-link" data-nav="/admin/users">Người dùng</a>';
        const adminSpan = document.getElementById('nav-admin');
        if (adminSpan && adminSpan.nextSibling) {
          adminSpan.parentNode.insertBefore(span, adminSpan.nextSibling);
        }
      }

      // Khởi động Notification Controller
      import('/controllers/NotificationController.js').then(m => {
        m.NotificationController.init(userData.uid);
        const bell = document.getElementById('notif-bell');
        if (bell && !bell._bound) {
          bell._bound = true;
          bell.addEventListener('click', e => {
            e.stopPropagation();
            m.NotificationController.toggle();
          });
        }
      });
    } else {
      // Đã logout → dừng polling
      import('/controllers/NotificationController.js').then(m => m.NotificationController.stop());
    }
  };

</script>

<script type="module" src="/app.js"></script>
</body>
</html>
