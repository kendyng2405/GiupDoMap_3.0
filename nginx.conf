server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback to index.html for Single Page Applications (SPA)
    # Actually this project uses Hash-based routing (#), so standard routing might be fine,
    # but it's good practice for SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ai-moderator/ {
        alias /usr/share/nginx/html/ai-moderator/;
        try_files $uri $uri/ /ai-moderator/index.html;
    }
}
