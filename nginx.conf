server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent browser caching of JS/CSS so updates are always loaded
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Fallback to index.html for Single Page Applications (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ai-moderator/ {
        alias /usr/share/nginx/html/ai-moderator/;
        try_files $uri $uri/ /ai-moderator/index.html;
    }
}
