server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    add_header Cross-Origin-Embedder-Policy "unsafe-none";

    # Proxy Firebase Auth handler to Firebase Hosting
    # This is needed because authDomain is set to traitimviet.online
    # but the /__/auth/ path is served by Firebase Hosting
    location /__/ {
        proxy_pass https://kdhelpmap.firebaseapp.com;
        proxy_set_header Host kdhelpmap.firebaseapp.com;
        proxy_ssl_server_name on;
    }

    # Fallback to index.html for Single Page Applications (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ai-moderator/ {
        alias /usr/share/nginx/html/ai-moderator/;
        try_files $uri $uri/ /ai-moderator/index.html;
    }
}
